[mypy]
warn_unused_ignores = True
warn_redundant_casts = True

# Third-party packages that ship no stubs. The contracts that matter here are
# pydantic models and this project's own signatures, which mypy checks fully.
#
# pyspark and awsglue are a different case: they only exist inside the Glue
# container and are deliberately not installed locally, which is what keeps
# aws/glue_jobs/etl_telemetry.py importable — and therefore testable — anywhere.
[mypy-pandas.*]
ignore_missing_imports = True

[mypy-duckdb.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-xgboost.*]
ignore_missing_imports = True

[mypy-shap.*]
ignore_missing_imports = True

[mypy-mlflow.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-boto3.*]
ignore_missing_imports = True

[mypy-imblearn.*]
ignore_missing_imports = True

[mypy-pyspark.*]
ignore_missing_imports = True

[mypy-awsglue.*]
ignore_missing_imports = True
